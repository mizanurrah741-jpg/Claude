<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CHUDLINGPONG BANGLADESH — ভ্রমণ পাসপোর্ট | Travel Passport</title>
<meta name="description" content="A free digital travel passport for Bangladesh. Collect stamps for the places you have visited and download your passport as a souvenir.">
<meta name="theme-color" content="#0a3528">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%230f4d3a' stroke='%23c8a24a' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23c0392b'/%3E%3C/svg%3E">
<style>
:root{
  --green:#0f4d3a;--green2:#1b6b4f;--green3:#0a3528;--cream:#f7f0df;--paper:#fcf8ec;
  --gold:#c8a24a;--gold2:#e7c874;--ink:#1c2923;--muted:#566860;--red:#b3261e;--line:#e3d9bf;
  --radius:18px;--shadow:0 10px 28px rgba(15,40,30,.14);
  --ff:'Noto Sans Bengali','Hind Siliguri','Kalpurush','Nirmala UI','Siyam Rupali','Vrinda','Bangla MN','Bengali Sangam MN',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --ffs:'Noto Serif Bengali','Kalpurush','Nirmala UI','Siyam Rupali','Vrinda',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:76px}
body{margin:0;font-family:var(--ff);color:var(--ink);line-height:1.65;overflow-x:hidden;
  background:radial-gradient(900px 420px at 8% -8%,#fff9e6 0,transparent 62%),repeating-linear-gradient(45deg,rgba(200,162,74,.05) 0 2px,transparent 2px 14px),var(--cream)}
img,svg{max-width:100%}
h1,h2,h3{font-family:var(--ffs);line-height:1.25;margin:0}
a{color:var(--green2)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:#fff;padding:8px 14px;border-radius:8px;z-index:300}
.skip:focus{left:8px}
.container{width:min(1180px,calc(100% - 32px));margin-inline:auto}
[hidden]{display:none!important}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:999px;border:2px solid transparent;font:inherit;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,background .15s;line-height:1.2;text-align:center}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.16)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
.btn.primary:hover{background:var(--green2)}
.btn.gold{background:linear-gradient(135deg,#f1d98c,var(--gold));color:#2a2108;border-color:#a8832e}
.btn.ghost{background:transparent;color:var(--green);border-color:var(--green)}
.btn.ghost-l{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.btn.danger{background:#fff;color:var(--red);border-color:var(--red)}
.btn.sm{min-height:40px;padding:6px 14px;font-size:14px}
.btn.lg{min-height:52px;padding:12px 26px;font-size:17px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.icon-btn{width:44px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.5);background:transparent;color:#fff;font-size:22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}

/* header */
.hdr{position:sticky;top:0;z-index:100;background:rgba(10,53,40,.97);backdrop-filter:blur(8px);color:#fff;border-bottom:3px solid var(--gold)}
.hdr-in{display:flex;align-items:center;gap:14px;min-height:66px;position:relative}
.logo{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.logo-mark svg{width:42px;height:42px;display:block}
.logo-txt{display:flex;flex-direction:column;line-height:1.1;font-family:var(--ffs)}
.logo-txt b{letter-spacing:.12em;font-size:15px}
.logo-txt i{font-style:normal;letter-spacing:.3em;font-size:10px;color:var(--gold2)}
nav{margin-left:auto;display:flex;align-items:center;gap:6px}
nav a:not(.btn){color:#eaf3ee;text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:600;font-size:15px}
nav a:not(.btn):hover{background:rgba(255,255,255,.12)}
.nav-toggle{display:none;margin-left:auto}
@media(max-width:940px){
  .nav-toggle{display:inline-flex}
  nav{position:absolute;top:100%;left:-16px;right:-16px;flex-direction:column;align-items:stretch;background:var(--green3);padding:12px 16px 18px;display:none;border-bottom:3px solid var(--gold);gap:8px}
  nav.open{display:flex}
  nav a:not(.btn){padding:12px 14px;font-size:17px}
}

/* hero */
.hero{background:linear-gradient(160deg,var(--green3),var(--green) 60%,#175c45);color:#fff;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(231,200,121,.07) 0 2px,transparent 2px 22px);pointer-events:none}
.hero-in{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding:56px 0 64px;position:relative}
.eyebrow{margin:0 0 12px;color:var(--gold2);font-weight:700;letter-spacing:.06em;font-size:14px}
.hero h1{font-size:clamp(32px,5.4vw,58px);color:#fff;text-wrap:balance}
.hero-sub{font-family:var(--ffs);font-size:clamp(18px,2.4vw,26px);color:var(--gold2);margin:10px 0 0}
.hero-desc{max-width:56ch;margin:18px 0 0;color:#e1eee7;font-size:17px}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
.counters{display:flex;gap:14px;flex-wrap:wrap;margin:30px 0 0}
.counters>div{background:rgba(255,255,255,.09);border:1px solid rgba(231,200,121,.45);border-radius:16px;padding:12px 20px;min-width:150px}
.counters dt{font-size:13px;color:#cfe3d8}
.counters dd{margin:0;font-family:var(--ffs);font-size:36px;font-weight:700;color:var(--gold2);line-height:1.15}
.hero-vis{position:relative;max-width:360px;width:100%;margin:0 auto;padding:10px 0 20px}
.hero-cover{transform:rotate(-4deg);filter:drop-shadow(0 22px 30px rgba(0,0,0,.45))}
.hero-cover svg{display:block;width:100%;height:auto;border-radius:12px}
.hs{position:absolute;width:62%;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35));animation:float 6s ease-in-out infinite}
.hs svg{display:block;width:100%;height:auto;background:#fcf8ec;border-radius:14px;padding:4px}
.hs1{right:-12%;top:6%;rotate:7deg}.hs2{left:-14%;top:36%;rotate:-8deg;animation-delay:-2s}.hs3{right:-8%;bottom:20%;rotate:5deg;animation-delay:-4s}.hs4{left:-6%;bottom:-2%;rotate:-5deg;animation-delay:-1s;width:56%}
@keyframes float{0%,100%{translate:0 0}50%{translate:0 -8px}}
@media(max-width:860px){.hero-in{grid-template-columns:1fr;padding:36px 0 48px}.hero-vis{max-width:300px;margin-top:10px}.hs1{right:-8%}.hs2{left:-8%}}

/* sections */
.sec{padding:56px 0}
.sec-head{margin-bottom:26px;max-width:70ch}
.sec-head h2{font-size:clamp(26px,3.6vw,38px);color:var(--green)}
.sec-head p{margin:8px 0 0;color:var(--muted);font-size:17px}
.panel{background:#fffdf5;border:2px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.builder-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:24px;align-items:start}
.builder-grid .preview{order:2}.builder-grid .controls{order:1}
@media(max-width:900px){.builder-grid{grid-template-columns:minmax(0,1fr)}.builder-grid .preview{order:1}.builder-grid .controls{order:2}}
.field{margin-bottom:16px}
label.lbl,.legend{display:block;font-weight:700;font-size:15px;margin-bottom:6px;color:var(--green)}
input[type=text],input[type=search],select{width:100%;min-height:46px;padding:9px 14px;border:2px solid var(--line);border-radius:12px;background:#fff;font:inherit;color:var(--ink)}
input[type=text]:focus,input[type=search]:focus,select:focus{border-color:var(--green2)}
.static-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.static-grid div{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:8px 12px}
.static-grid small{display:block;color:var(--muted);font-size:12px}
.static-grid b{font-size:15px}
.hint{font-size:13px;color:var(--muted);margin:4px 0 0}
fieldset{border:0;margin:0 0 16px;padding:0;min-width:0}
.opts{display:flex;flex-wrap:wrap;gap:10px}
.opt{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:78px;cursor:pointer;text-align:center;font-size:12px;line-height:1.25}
.opt input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opt .swatch,.opt .pv{width:54px;height:54px;border-radius:14px;border:3px solid transparent;box-shadow:0 0 0 2px var(--line);transition:box-shadow .15s,transform .15s;display:block}
.opt .pv{background:none}
.opt:hover .swatch,.opt:hover .pv{transform:translateY(-2px)}
.opt input:checked~.swatch,.opt input:checked~.pv{box-shadow:0 0 0 3px var(--green2);border-color:#fff}
.opt input:checked~.otxt{font-weight:800;color:var(--green)}
.opt input:focus-visible~.swatch,.opt input:focus-visible~.pv{outline:3px solid var(--gold);outline-offset:3px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.tabs{display:flex;gap:8px;margin-bottom:14px;background:var(--paper);padding:5px;border-radius:999px;border:1px solid var(--line)}
.tabs button{flex:1;min-height:42px;border:0;border-radius:999px;background:transparent;font:inherit;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button[aria-selected=true]{background:var(--green);color:#fff}
.stage{width:min(100%,400px);margin:0 auto;perspective:1200px}
.stage:focus-visible{outline-offset:6px}
.pass-page{filter:drop-shadow(0 16px 24px rgba(15,40,30,.3))}
.pass-page svg{display:block;width:100%;height:auto;border-radius:10px;aspect-ratio:480/680}
.pass-page.flip{animation:flip .38s ease}
@keyframes flip{from{opacity:.2;transform:rotateY(-14deg) translateX(10px)}to{opacity:1;transform:none}}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin:16px 0}
.pager span{min-width:130px;text-align:center;font-weight:700;color:var(--green)}
.dl-row{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.dl-row .btn.lg{width:100%}

/* stats */
.stats{margin-top:28px}
.stat-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.sc{background:#fffdf5;border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.sc small{display:block;color:var(--muted);font-size:13px}
.sc b{font-family:var(--ffs);font-size:30px;color:var(--green);line-height:1.2}
.sc.hl{background:var(--green);border-color:var(--green)}.sc.hl small{color:#cfe3d8}.sc.hl b{color:var(--gold2)}
.prog{margin:18px 0}
.prog-top{display:flex;justify-content:space-between;font-weight:700;margin-bottom:6px}
.bar{height:14px;border-radius:999px;background:#e8dfc4;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--green2),var(--gold));border-radius:999px;transition:width .5s ease}
.divbars{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 22px}
.divbars .row{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;font-size:14px}
.divbars .bar{height:9px}

/* explore */
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:12px;align-items:end}
.search-wrap{position:relative}
.search-wrap input{padding-right:48px}
.clr-x{position:absolute;right:4px;bottom:3px;width:40px;height:40px;border:0;background:transparent;font-size:22px;color:var(--muted);cursor:pointer;border-radius:50%}
.tool2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}
.chk-line{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-weight:600;cursor:pointer}
.chk-line input{width:22px;height:22px;accent-color:var(--green)}
.count{font-weight:700;color:var(--green);margin:6px 0 14px}
@media(max-width:980px){.toolbar{grid-template-columns:1fr 1fr}.search-wrap{grid-column:1/-1}}
@media(max-width:520px){.toolbar{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;list-style:none;margin:0;padding:0}
@media(max-width:560px){.grid{grid-template-columns:1fr 1fr;gap:10px}}
@media(max-width:380px){.grid{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;gap:8px;position:relative;height:100%;background:#fffdf5;border:2px solid var(--line);border-radius:18px;padding:10px 12px 12px;cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s,background .15s;content-visibility:auto;contain-intrinsic-size:auto 330px}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.card .chk{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:2}
.card:has(.chk:focus-visible){outline:3px solid var(--gold);outline-offset:3px}
.card.sel{border-color:var(--green2);background:#edf7f1;box-shadow:0 0 0 3px rgba(27,107,79,.2)}
.card.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.96)}50%{transform:scale(1.04)}100%{transform:scale(1)}}
.thumb-box{background:var(--paper);border:1px dashed var(--line);border-radius:12px;padding:2px;transition:filter .2s,opacity .2s}
.thumb{display:block;width:100%;height:auto}
.card:not(.sel) .thumb-box{filter:grayscale(.9);opacity:.5}
.check{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;color:transparent;z-index:1;pointer-events:none}
.card.sel .check{background:var(--green2);border-color:var(--green2);color:#fff}
.cbody{display:flex;flex-direction:column;gap:2px}
.cbody .n1{font-family:var(--ffs);font-weight:700;font-size:17px;line-height:1.3;color:var(--ink)}
.cbody .n2{font-size:14px;color:var(--muted)}
.cbody .meta{font-size:13px;color:var(--green2);font-weight:600}
.cbody .desc{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{background:#f1e8cc;color:#5b4a14;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.chip.d{background:#e2eefb;color:#1d4f91}
.empty{text-align:center;padding:48px 16px;background:#fffdf5;border:2px dashed var(--line);border-radius:22px}
.empty h3{color:var(--green);margin-bottom:6px}
.more-wrap{text-align:center;margin:24px 0 0}

/* about / footer */
.about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}
.about-grid .panel p{margin:8px 0 0}
.about-grid h3{color:var(--green);font-size:20px}
footer{background:var(--green3);color:#dcebe3;padding:36px 0 40px;margin-top:20px;border-top:4px solid var(--gold)}
footer .disc{border:1px solid rgba(231,200,121,.6);border-radius:14px;padding:14px 18px;background:rgba(255,255,255,.06);color:#fff;font-weight:600}
footer .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:20px}
footer h3{color:var(--gold2);font-size:18px;margin-bottom:6px}
footer p{margin:0;font-size:15px}
.copy{margin-top:22px;font-size:13px;color:#a9c2b6}
#toTop{position:fixed;right:16px;bottom:16px;width:48px;height:48px;border-radius:50%;border:2px solid var(--gold);background:var(--green);color:#fff;font-size:22px;cursor:pointer;z-index:90;box-shadow:var(--shadow)}
.warn{background:#fff3cd;color:#664d03;padding:10px 16px;text-align:center;font-weight:600;border-bottom:1px solid #e6cf7f}

/* toasts, fx, dialogs */
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:250;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,420px);pointer-events:none}
.toast{background:var(--green3);color:#fff;border:1px solid var(--gold);border-radius:14px;padding:11px 18px;font-weight:600;box-shadow:var(--shadow);animation:tin .25s ease;text-align:center}
.toast.err{background:#7a1f1f;border-color:#e9a0a0}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#fx{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;pointer-events:none}
#fx.on{display:flex}
#fx svg{width:min(70vw,300px);height:auto;background:rgba(252,248,236,.94);border-radius:24px;padding:10px;box-shadow:0 20px 50px rgba(0,0,0,.4);animation:slam 1s ease forwards}
@keyframes slam{0%{transform:scale(2.6) rotate(-10deg);opacity:0}30%{transform:scale(1) rotate(0);opacity:1}80%{opacity:1}100%{transform:scale(1);opacity:0}}
dialog{border:0;border-radius:22px;padding:0;width:min(560px,92vw);max-height:90vh;overflow:auto;color:var(--ink);background:var(--paper);box-shadow:0 24px 60px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(8,28,20,.6)}
.dlg{padding:24px}
.dlg h2{font-size:24px;color:var(--green);margin-bottom:10px}
.dlg ol{padding-left:22px;margin:10px 0}
.dlg li{margin:6px 0}
.dlg .btn-row{margin-top:18px}
.note{background:#fff3cd;border-radius:12px;padding:10px 14px;font-size:14px;margin-top:10px;color:#664d03}
#printRoot{display:none}

/* print */
@page{size:148mm 210mm;margin:0}
@media print{
  html,body{background:#fff!important;margin:0!important;padding:0!important;height:auto!important;overflow:visible!important}
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  .print-page{width:148mm;height:210mm;overflow:hidden;page-break-after:always;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .print-page:last-child{page-break-after:auto;break-after:auto}
  .print-page svg{display:block;width:148mm;height:210mm;border-radius:0}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#main" data-i18n="skip"></a>
<div id="storeWarn" class="warn" role="alert" hidden></div>

<header class="hdr">
  <div class="container hdr-in">
    <a class="logo" href="#home" aria-label="CHUDLINGPONG BANGLADESH">
      <span class="logo-mark" id="logoMark"></span>
      <span class="logo-txt"><b>CHUDLINGPONG</b><i>BANGLADESH</i></span>
    </a>
    <button class="icon-btn nav-toggle" id="navBtn" aria-expanded="false" aria-controls="nav" data-i18n-aria="menu">☰</button>
    <nav id="nav" data-i18n-aria="nav_label">
      <a href="#home" data-i18n="nav_home"></a>
      <a href="#builder" data-i18n="nav_passport"></a>
      <a href="#explore" data-i18n="nav_explore"></a>
      <a href="#about" data-i18n="nav_about"></a>
      <button class="btn ghost-l sm" id="langBtn" type="button"></button>
      <a class="btn gold sm" href="#builder" data-focus="1" data-i18n="cta_create"></a>
    </nav>
  </div>
</header>

<main id="main">
<section id="home" class="hero" aria-labelledby="heroH1">
  <div class="container hero-in">
    <div class="hero-copy">
      <p class="eyebrow">✦ CHUDLINGPONG BANGLADESH ✦</p>
      <h1 id="heroH1"></h1>
      <p class="hero-sub" id="heroSub"></p>
      <p class="hero-desc" data-i18n="hero_desc"></p>
      <div class="hero-cta">
        <a class="btn gold lg" href="#builder" data-focus="1" data-i18n="hero_cta"></a>
        <a class="btn ghost-l lg" href="#explore" data-i18n="hero_cta2"></a>
      </div>
      <dl class="counters">
        <div><dt data-i18n="cnt_total"></dt><dd id="cTotal">0</dd></div>
        <div><dt data-i18n="cnt_sel"></dt><dd id="cSel">0</dd></div>
      </dl>
    </div>
    <div class="hero-vis" id="heroVis" aria-hidden="true"></div>
  </div>
</section>

<section id="builder" class="sec" aria-labelledby="bTitle">
  <div class="container">
    <div class="sec-head"><h2 id="bTitle" data-i18n="b_title"></h2><p data-i18n="b_lead"></p></div>
    <div class="builder-grid">
      <div class="panel controls">
        <div class="field">
          <label class="lbl" for="inName" data-i18n="f_name"></label>
          <input type="text" id="inName" maxlength="40" autocomplete="off" data-i18n-ph="f_name_ph">
        </div>
        <div class="static-grid">

 ab_title:['আমাদের সম্পর্কে','About'],ab_h1:['এটি কী','What this is'],ab_h2:['স্থানের তালিকা','The destination list'],ab_h3:['স্ট্যাম্পগুলো','The stamps'],
 ab_text:['চুডলিংপং বাংলাদেশ একটি বিনামূল্যের, অ্যাকাউন্টহীন ডিজিটাল ভ্রমণ পাসপোর্ট। এটি বাংলাদেশের নদী, পাহাড়, সমুদ্র, বন, ইতিহাস ও সংস্কৃতির স্মৃতি জমিয়ে রাখতে সাহায্য করে।','Chudlingpong Bangladesh is a free, account-free digital travel passport. It helps you keep memories of Bangladesh’s rivers, hills, sea, forests, history and culture.'],
 ab_data:['৬৪ জেলার প্রতিটির জন্য অন্তত একটি এন্ট্রি আছে। “জেলা স্ট্যাম্প” চিহ্নিত এন্ট্রি নির্দিষ্ট কোনো স্থাপনা নয়, শুধু জেলাভিত্তিক স্মারক। তালিকাটি একটি জাভাস্ক্রিপ্ট অ্যারেতে আছে, তাই নতুন স্থান সহজে যোগ করা যায়।','Every one of the 64 districts has at least one entry. Entries marked “District stamp” are district-based souvenirs, not a specific landmark. The list lives in one JavaScript array, so new places are easy to add.'],
 ab_stamps:['প্রতিটি স্থানের নিজস্ব স্ট্যাম্পের নকশা, রং ও আইকন আছে। স্ট্যাম্পের হালকা ঘূর্ণন শুধু স্ক্র্যাপবুকের মতো দেখানোর জন্য।','Each place has its own stamp shape, ink color and icon. The slight tilt is only there for a scrapbook look.'],
 disclaimer:['এই ডিজিটাল ভ্রমণ পাসপোর্ট একটি ব্যক্তিগত স্মারক; এটি সরকারি ভ্রমণ নথি নয় এবং ভ্রমণের প্রমাণও নয়।','This digital travel passport is a personal souvenir and is not an official travel document or proof of a visit.'],

function genPno(){const ch='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';let r;
  try{r=crypto.getRandomValues(new Uint8Array(8));}catch(e){r=Array.from({length:8},()=>Math.floor(Math.random()*256));}
  for(let i=0;i<8;i++){s+=ch[r[i]%ch.length];if(i===3)s+='-';}return 'CP-'+s;}
function defaultState(lang){return{v:1,name:'',color:'green',pattern:'waves',emblem:'map',lang:lang||'bn',sel:{},pno:genPno(),created:Date.now(),guide:false};}
function sanitize(o){
  if(!o||typeof o!=='object')return null;const s=defaultState();
  if(o.lang==='bn'||o.lang==='en')s.lang=o.lang;
  if(typeof o.name==='string')s.name=cleanName(o.name);
  if(COV[o.color])s.color=o.color;if(PATTERNS.includes(o.pattern))s.pattern=o.pattern;if(EMBLEMS.includes(o.emblem))s.emblem=o.emblem;
  if(typeof o.pno==='string'&&/^CP-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(o.pno))s.pno=o.pno;
  if(Number.isFinite(+o.created)&&+o.created>0)s.created=+o.created;
  s.guide=!!o.guide;
  if(o.sel&&typeof o.sel==='object'){Object.keys(o.sel).forEach(id=>{if(DID[id])s.sel[id]=Number.isFinite(+o.sel[id])&&+o.sel[id]>0?+o.sel[id]:Date.now();});}
  return s;}
function cleanName(v){return String(v).replace(/[\u0000-\u001f\u007f<>]/g,'').replace(/\s+/g,' ').slice(0,40);}
function loadState(){try{const raw=localStorage.getItem(KEY);storageOK=true;return raw?sanitize(JSON.parse(raw)):null;}catch(e){storageOK=false;return null;}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;return true;}catch(e){storageOK=false;return false;}}
function wipeStore(){try{localStorage.removeItem(KEY);}catch(e){}}

function stats(){
  const sel=selList(),divs=new Set(sel.map(d=>d.div)),dists=new Set(sel.map(d=>d.dk)),per={};

/* =====================================================================
   4. TEXT FITTING (for SVG text)
   ===================================================================== */
function tw(s,fs){let w=0;for(const ch of String(s)){const c=ch.charCodeAt(0);
  if(c>=0x980&&c<=0x9FF){if(c===0x9CD)w-=0.3;else if((c>=0x981&&c<=0x983)||c===0x9BC||(c>=0x9BE&&c<=0x9CC)||c===0x9D7)w+=0.1;else w+=0.6;}
  else w+=ch===' '?0.28:(/[A-Z]/.test(ch)?0.64:0.52);}
  return Math.max(w,0)*fs;}
function fitLines(text,maxW,fsMax,fsMin,maxLines){
  const w1=tw(text,fsMax),f1=w1<=maxW?fsMax:Math.max(fsMin,fsMax*maxW/w1);
  if(maxLines<2||text.indexOf(' ')<0||f1>=fsMax*0.8)return{lines:[text],fs:f1};
  const words=text.split(' ');let best=null;
  for(let i=1;i<words.length;i++){const a=words.slice(0,i).join(' '),b=words.slice(i).join(' ');const m=Math.max(tw(a,fsMax),tw(b,fsMax));if(!best||m<best.m)best={a:a,b:b,m:m};}
  const f2=best.m<=maxW?fsMax:Math.max(fsMin,fsMax*maxW/best.m);
  return{lines:[best.a,best.b],fs:f2};}
function wrapW(text,maxW,fs){const words=String(text).split(' ');const out=[];let line='';
  words.forEach(w=>{const tryL=line?line+' '+w:w;if(tw(tryL,fs)<=maxW||!line)line=tryL;else{out.push(line);line=w;}});if(line)out.push(line);return out;}

function star4(x,y,col){return '<path transform="translate('+x+' '+y+')" d="M0-5L1.5-1.5 5 0 1.5 1.5 0 5-1.5 1.5-5 0-1.5-1.5Z" fill="'+col+'"/>';}
/* One destination's stamp, centred on (0,0). Deterministic: same destination = same stamp. */
function stampG(d,ts,filterId){
  const s=d.stamp,col=INK[s.color],sh=SH[s.style],w=sh.w,half=w/2;
  let o='<g transform="translate('+s.dx+' '+s.dy+') rotate('+s.rot.toFixed(2)+')"'+(filterId?' filter="url(#'+filterId+')"':'')+' opacity=".94">';
  o+='<g fill="none" stroke="'+col+'">'+sh.o+'</g>';
  o+='<g transform="translate(0 -29) scale(.78)">'+glyph(d.cat,col)+'</g>';
  const sx=Math.min(44,half-8);
  if(s.variant===1)o+=star4(-sx,-29,col)+star4(sx,-29,col);
  else if(s.variant===2){const r=Math.min(40,half-14);o+='<path d="M'+(-r)+' -9H-8M8 -9H'+r+'" stroke="'+col+'" stroke-width="1"/><path d="M0-12L3-9 0-6-3-9Z" fill="'+col+'"/>';}
  else if(s.variant===3)o+='<circle cx="'+(-sx)+'" cy="-29" r="2" fill="'+col+'"/><circle cx="'+sx+'" cy="-29" r="2" fill="'+col+'"/><circle cx="'+(-sx+7)+'" cy="-29" r="1.2" fill="'+col+'"/><circle cx="'+(sx-7)+'" cy="-29" r="1.2" fill="'+col+'"/>';
  const lines=[];const bn=fitLines(d.bn,w,15,8,2),en=fitLines(d.en,w,9.4,5.6,2);
  bn.lines.forEach(x=>lines.push({t:x,fs:bn.fs,wt:700,ls:0}));
  en.lines.forEach(x=>lines.push({t:x,fs:en.fs,wt:500,ls:0}));
  const dtx=d.dk.toUpperCase(),df=fitLines(dtx,w*0.78,6.6,4.6,1).fs;
  lines.push({t:dtx,fs:df,wt:600,ls:0.5});
  lines.push({t:'BD · '+fmtDate(ts),fs:Math.min(6,fitLines('BD · 00 MMM 0000',w*0.74,6,4.5,1).fs),wt:500,ls:0.3});
  let H=0;lines.forEach(l=>H+=l.fs*1.2);const k=Math.min(1,58/H);H*=k;
  let y=-10+(58-H)/2;
  lines.forEach(l=>{const fs=l.fs*k;y+=fs*1.2;o+='<text x="0" y="'+(y-fs*0.22).toFixed(1)+'" text-anchor="middle" font-size="'+fs.toFixed(2)+'" font-weight="'+l.wt+'" fill="'+col+'"'+(l.ls?' letter-spacing="'+l.ls+'"':'')+'>'+esc(l.t)+'</text>';});
  return o+'</g>';}

  img.onload=()=>{try{const c=document.createElement('canvas');c.width=480*scale;c.height=680*scale;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
    c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png');}catch(e){rej(e);}};
  img.onerror=()=>rej(new Error('image'));
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);});}
function downloadBlob(blob,name){const a=document.createElement('a');const url=URL.createObjectURL(blob);a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{a.remove();URL.revokeObjectURL(url);},3000);}
const pageName=i=>'chudlingpong-bangladesh-passport-'+(i===0?'cover':'page-'+String(i).padStart(2,'0'))+'.png';
async function exportPng(i){const blob=await svgToPng(pageSVG(i,'x'+i),3);downloadBlob(blob,pageName(i));}
async function exportPngOne(){try{await exportPng(view.page);toast(t('m_png_ok'));}catch(e){toast(t('m_png_fail'),true);}}
async function exportPngAll(){
  const n=pageCount();toast(t('m_png_all',num(n)));
  try{for(let i=0;i<n;i++){await exportPng(i);await new Promise(r=>setTimeout(r,450));}toast(t('m_png_ok'));}catch(e){toast(t('m_png_fail'),true);}}

/* ---- Filters ---- */
const onQ=debounce(()=>{F.q=$('#fQ').value;renderGrid();},140);
function resetFilters(){F.q='';F.div='';F.dist='';F.cat='';F.only=false;F.sort='def';$('#fQ').value='';$('#fOnly').checked=false;fillSelects();renderGrid();}
function setPage(p){const old=view.page;view.page=p;clampPage();renderPreview(old!==view.page);}

/* =====================================================================
   8. EVENTS & INIT
   ===================================================================== */
function bind(){
  $('#langBtn').addEventListener('click',()=>{state.lang=lang()==='bn'?'en':'bn';persist();renderAll();});
  $('#navBtn').addEventListener('click',()=>{const n=$('#nav'),o=!n.classList.contains('open');n.classList.toggle('open',o);$('#navBtn').setAttribute('aria-expanded',o);});
  $('#nav').addEventListener('click',e=>{if(e.target.closest('a')){$('#nav').classList.remove('open');$('#navBtn').setAttribute('aria-expanded','false');}});
  document.addEventListener('click',e=>{const a=e.target.closest('a[data-focus]');if(a)setTimeout(()=>{const i=$('#inName');if(i)i.focus({preventScroll:true});},450);});
  $('#inName').addEventListener('input',e=>{const v=cleanName(e.target.value);state.name=v;renderPreview();renderHero();scheduleSave();});
  $('#builder').addEventListener('change',e=>{const n=e.target;if(n.name==='color'&&COV[n.value])state.color=n.value;else if(n.name==='pattern'&&PATTERNS.includes(n.value))state.pattern=n.value;else if(n.name==='emblem'&&EMBLEMS.includes(n.value))state.emblem=n.value;else return;
    renderOpts();renderPreview(false);renderHero();scheduleSave();
    const again=$('input[name="'+n.name+'"]:checked');if(again)again.focus();});
  $('#btnSave').addEventListener('click',savePassport);$('#btnReset').addEventListener('click',resetPassport);$('#btnNew').addEventListener('click',newPassport);
  $('#btnGuide').addEventListener('click',()=>openDlg($('#dlgGuide')));
  $('#tabCover').addEventListener('click',()=>setPage(0));$('#tabPages').addEventListener('click',()=>setPage(view.page===0?1:view.page));
  $('#pgPrev').addEventListener('click',()=>setPage(view.page-1));$('#pgNext').addEventListener('click',()=>setPage(view.page+1));
  $('#stage').addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();setPage(view.page+1);}else if(e.key==='ArrowLeft'){e.preventDefault();setPage(view.page-1);}});
  $('#btnDownload').addEventListener('click',openExport);$('#btnShare').addEventListener('click',sharePassport);$('#btnCopy').addEventListener('click',copyList);
  $('#exPdf').addEventListener('click',doPrint);$('#exPng1').addEventListener('click',exportPngOne);$('#exPngAll').addEventListener('click',exportPngAll);$('#exClose').addEventListener('click',()=>closeDlg($('#dlgExport')));
  $('#gGo').addEventListener('click',()=>closeDlg($('#dlgGuide')));
  $('#dlgGuide').addEventListener('close',()=>{if(!state.guide){state.guide=true;scheduleSave();}});
  $$('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)closeDlg(d);}));
  $('#fQ').addEventListener('input',onQ);
  $('#fQClear').addEventListener('click',()=>{$('#fQ').value='';F.q='';renderGrid();$('#fQ').focus();});
  $('#btnClearQ').addEventListener('click',()=>{$('#fQ').value='';F.q='';renderGrid();});
  $('#fDiv').addEventListener('change',e=>{F.div=e.target.value;F.dist='';fillSelects();renderGrid();});
  $('#fDist').addEventListener('change',e=>{F.dist=e.target.value;renderGrid();});
  $('#fCat').addEventListener('change',e=>{F.cat=e.target.value;renderGrid();});
  $('#fSort').addEventListener('change',e=>{F.sort=e.target.value;renderGrid();});
  $('#fOnly').addEventListener('change',e=>{F.only=e.target.checked;renderGrid();});
  $('#btnSelAll').addEventListener('click',selectAllResults);$('#btnClearAll').addEventListener('click',clearAll);
  $('#btnResetF').addEventListener('click',resetFilters);$('#btnEmptyReset').addEventListener('click',resetFilters);$('#btnMore').addEventListener('click',showMore);
  $('#grid').addEventListener('change',e=>{const c=e.target;if(c&&c.classList&&c.classList.contains('chk'))setSelected(c.getAttribute('data-id'),c.checked);});
  const tt=$('#toTop');window.addEventListener('scroll',()=>{tt.hidden=window.scrollY<600;},{passive:true});
  tt.addEventListener('click',()=>window.scrollTo({top:0}));
  window.addEventListener('beforeprint',buildPrint);window.addEventListener('afterprint',clearPrint);
}
function init(){
  $('#logoMark').innerHTML=logoSVG();
  $('#inName').value=state.name;
  bind();renderAll();
  if(!state.guide)setTimeout(()=>{if(!state.guide)openDlg($('#dlgGuide'));},900);
}
init();
})();
</script>
